<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · 沙丁鱼</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --cream:#fdf6ec; --cream2:#faefd8; --warm:#f5e6c8; --accent-orange:#f07d3a; --accent-pink:#f06b8a; --text-dark:#2d2416; --text-mid:#6b5740; --text-light:#a89070; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'Noto Sans SC',sans-serif; color:var(--text-dark); min-height:100vh; }
  nav { position:sticky; top:0; z-index:100; background:rgba(253,246,236,0.92); backdrop-filter:blur(10px); border-bottom:2px dashed rgba(240,125,58,0.25); padding:0 1.5rem; height:56px; display:flex; align-items:center; justify-content:space-between; }
  .back-btn { font-family:'Caveat',cursive; font-size:1.1rem; color:var(--accent-orange); text-decoration:none; padding:4px 10px; border-radius:12px; }
  .page-title { font-family:'Caveat',cursive; font-size:1.4rem; font-weight:700; }

  .game-wrap { max-width:420px; margin:0 auto; padding:1.5rem 1rem; }

  .score-row { display:flex; gap:10px; margin-bottom:1.2rem; justify-content:center; }
  .score-box { background:white; border:1.5px solid var(--warm); border-radius:14px; padding:8px 20px; text-align:center; }
  .score-label { font-family:'Caveat',cursive; font-size:0.85rem; color:var(--text-light); }
  .score-val { font-family:'Caveat',cursive; font-size:1.6rem; font-weight:700; color:var(--accent-orange); }

  .btn-row { display:flex; gap:8px; margin-bottom:1.2rem; justify-content:center; }
  .btn { font-family:'Caveat',cursive; font-size:1rem; border:none; border-radius:14px; padding:8px 22px; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:var(--accent-orange); color:white; box-shadow:0 3px 10px rgba(240,125,58,0.3); }
  .btn-primary:hover { opacity:0.88; transform:scale(1.03); }

  .board { background:#e8d9c0; border-radius:16px; padding:10px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; touch-action:none; user-select:none; }

  .cell { aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'Caveat',cursive; font-weight:700; font-size:1.6rem; transition:all 0.1s ease; }

  .cell-0    { background:#d4c4a8; }
  .cell-2    { background:#fdf6ec; color:#776e65; }
  .cell-4    { background:#faefd8; color:#776e65; }
  .cell-8    { background:#f07d3a; color:white; }
  .cell-16   { background:#f06b8a; color:white; }
  .cell-32   { background:#e05555; color:white; }
  .cell-64   { background:#d44040; color:white; }
  .cell-128  { background:#5bba8a; color:white; font-size:1.3rem; }
  .cell-256  { background:#4a9fd4; color:white; font-size:1.3rem; }
  .cell-512  { background:#a78bfa; color:white; font-size:1.3rem; }
  .cell-1024 { background:#f5c842; color:white; font-size:1.1rem; }
  .cell-2048 { background:#f07d3a; color:white; font-size:1.1rem; box-shadow:0 0 20px rgba(240,125,58,0.5); }

  .overlay { display:none; position:fixed; inset:0; background:rgba(45,36,22,0.5); z-index:200; align-items:center; justify-content:center; }
  .overlay.show { display:flex; }
  .overlay-box { background:white; border-radius:24px; padding:2rem; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
  .overlay-title { font-family:'Caveat',cursive; font-size:2rem; font-weight:700; margin-bottom:0.5rem; }
  .overlay-score { font-family:'Caveat',cursive; font-size:1.2rem; color:var(--text-mid); margin-bottom:1.5rem; }

  .hint { text-align:center; font-family:'Caveat',cursive; font-size:0.95rem; color:var(--text-light); margin-top:1rem; }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="back-btn">← 回首页</a>
  <span class="page-title">🎮 2048</span>
  <span></span>
</nav>

<div class="game-wrap">
  <div class="score-row">
    <div class="score-box"><div class="score-label">当前分数</div><div class="score-val" id="score">0</div></div>
    <div class="score-box"><div class="score-label">最高分</div><div class="score-val" id="best">0</div></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="newGame()">🔄 新游戏</button>
  </div>
  <div class="board" id="board"></div>
  <div class="hint">← → ↑ ↓ 键盘控制 · 手机可滑动</div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="overlay-title" id="overlay-title">游戏结束 😭</div>
    <div class="overlay-score" id="overlay-score">最终分数：0</div>
    <button class="btn btn-primary" onclick="newGame();document.getElementById('overlay').classList.remove('show')">再来一局 🎮</button>
  </div>
</div>

<script>
  let grid = [], score = 0, best = parseInt(localStorage.getItem('2048best')||'0');

  function newGame() {
    grid = Array.from({length:4}, () => Array(4).fill(0));
    score = 0;
    addRandom(); addRandom();
    render();
  }

  function addRandom() {
    const empty = [];
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!grid[r][c]) empty.push([r,c]);
    if (!empty.length) return;
    const [r,c] = empty[Math.floor(Math.random()*empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    document.getElementById('score').textContent = score;
    if (score > best) { best = score; localStorage.setItem('2048best', best); }
    document.getElementById('best').textContent = best;
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
      const v = grid[r][c];
      const cell = document.createElement('div');
      cell.className = 'cell cell-' + (v > 2048 ? '2048' : v);
      cell.textContent = v || '';
      board.appendChild(cell);
    }
  }

  function move(dir) {
    let moved = false;
    const rotate = (g) => g[0].map((_,i) => g.map(r=>r[i]).reverse());
    let g = grid.map(r=>[...r]);

    if (dir==='right') g = g.map(r=>r.reverse());
    else if (dir==='up') g = rotate(rotate(rotate(g)));
    else if (dir==='down') g = rotate(g);

    g = g.map(row => {
      let r = row.filter(v=>v);
      for (let i=0;i<r.length-1;i++) {
        if (r[i]===r[i+1]) { r[i]*=2; score+=r[i]; r.splice(i+1,1); moved=true; }
      }
      while (r.length<4) r.push(0);
      if (r.join()!==row.join()) moved=true;
      return r;
    });

    if (dir==='right') g = g.map(r=>r.reverse());
    else if (dir==='up') g = rotate(g);
    else if (dir==='down') g = rotate(rotate(rotate(g)));

    if (moved) { grid=g; addRandom(); render(); checkEnd(); }
  }

  function checkEnd() {
    for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
      if (!grid[r][c]) return;
      if (c<3 && grid[r][c]===grid[r][c+1]) return;
      if (r<3 && grid[r][c]===grid[r+1][c]) return;
    }
    document.getElementById('overlay-title').textContent = '游戏结束 😭';
    document.getElementById('overlay-score').textContent = '最终分数：' + score;
    document.getElementById('overlay').classList.add('show');
  }

  document.addEventListener('keydown', e => {
    const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
  });

  let tx=0, ty=0;
  document.getElementById('board').addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
  document.getElementById('board').addEventListener('touchend', e => {
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if (Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  });

  newGame();
</script>
</body>
</html>
