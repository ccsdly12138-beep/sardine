<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · 沙丁鱼</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --cream:#fdf6ec; --cream2:#faefd8; --warm:#f5e6c8; --accent-orange:#f07d3a; --accent-green:#5bba8a; --text-dark:#2d2416; --text-mid:#6b5740; --text-light:#a89070; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'Noto Sans SC',sans-serif; color:var(--text-dark); min-height:100vh; }
  nav { position:sticky; top:0; z-index:100; background:rgba(253,246,236,0.92); backdrop-filter:blur(10px); border-bottom:2px dashed rgba(240,125,58,0.25); padding:0 1.5rem; height:56px; display:flex; align-items:center; justify-content:space-between; }
  .back-btn { font-family:'Caveat',cursive; font-size:1.1rem; color:var(--accent-orange); text-decoration:none; padding:4px 10px; border-radius:12px; }
  .page-title { font-family:'Caveat',cursive; font-size:1.4rem; font-weight:700; }

  .game-wrap { max-width:420px; margin:0 auto; padding:1.5rem 1rem; display:flex; flex-direction:column; align-items:center; gap:1rem; }

  .score-row { display:flex; gap:10px; }
  .score-box { background:white; border:1.5px solid var(--warm); border-radius:14px; padding:8px 20px; text-align:center; }
  .score-label { font-family:'Caveat',cursive; font-size:0.85rem; color:var(--text-light); }
  .score-val { font-family:'Caveat',cursive; font-size:1.6rem; font-weight:700; color:var(--accent-green); }

  canvas { border-radius:16px; border:3px solid var(--warm); background:#1a2e1a; display:block; max-width:100%; }

  .btn-row { display:flex; gap:8px; }
  .btn { font-family:'Caveat',cursive; font-size:1rem; border:none; border-radius:14px; padding:8px 22px; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:var(--accent-green); color:white; box-shadow:0 3px 10px rgba(91,186,138,0.3); }
  .btn-primary:hover { opacity:0.88; transform:scale(1.03); }
  .btn-secondary { background:white; color:var(--text-mid); border:1.5px solid var(--warm); }

  /* dpad */
  .dpad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,48px); gap:4px; }
  .dpad-btn { width:48px; height:48px; border-radius:12px; background:white; border:1.5px solid var(--warm); font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; -webkit-tap-highlight-color:transparent; }
  .dpad-btn:active { background:var(--cream2); transform:scale(0.93); }
  .dpad-empty { visibility:hidden; }

  .hint { font-family:'Caveat',cursive; font-size:0.95rem; color:var(--text-light); }

  .overlay { display:none; position:fixed; inset:0; background:rgba(45,36,22,0.5); z-index:200; align-items:center; justify-content:center; }
  .overlay.show { display:flex; }
  .overlay-box { background:white; border-radius:24px; padding:2rem; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.2); min-width:240px; }
  .overlay-title { font-family:'Caveat',cursive; font-size:2rem; font-weight:700; margin-bottom:0.5rem; }
  .overlay-score { font-family:'Caveat',cursive; font-size:1.2rem; color:var(--text-mid); margin-bottom:1.5rem; }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="back-btn">← 回首页</a>
  <span class="page-title">🐍 贪吃蛇</span>
  <span></span>
</nav>

<div class="game-wrap">
  <div class="score-row">
    <div class="score-box"><div class="score-label">分数</div><div class="score-val" id="score">0</div></div>
    <div class="score-box"><div class="score-label">最高</div><div class="score-val" id="best">0</div></div>
  </div>

  <canvas id="canvas" width="360" height="360"></canvas>

  <div class="btn-row">
    <button class="btn btn-primary" id="start-btn" onclick="startGame()">▶ 开始</button>
    <button class="btn btn-secondary" onclick="togglePause()">⏸ 暂停</button>
  </div>

  <div class="dpad">
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="setDir(0,-1)">↑</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="setDir(-1,0)">←</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="setDir(1,0)">→</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" onclick="setDir(0,1)">↓</button>
    <div class="dpad-empty"></div>
  </div>

  <div class="hint">键盘方向键 或 点击方向按钮</div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="overlay-title">游戏结束 🐍</div>
    <div class="overlay-score" id="overlay-score">得了 0 分</div>
    <button class="btn btn-primary" onclick="startGame();document.getElementById('overlay').classList.remove('show')">再来 🎮</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const SIZE = 18, COLS = 20, ROWS = 20;
  const MARGIN = (canvas.width - COLS * SIZE) / 2;

  let snake, dir, nextDir, food, timer, running, paused, score, best;
  best = parseInt(localStorage.getItem('snakeBest')||'0');
  document.getElementById('best').textContent = best;

  function startGame() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; running = true; paused = false;
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, 120);
    render();
  }

  function placeFood() {
    do { food = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
    while (snake.some(s=>s.x===food.x&&s.y===food.y));
  }

  function tick() {
    if (!running || paused) return;
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)) {
      running = false; clearInterval(timer);
      if (score > best) { best=score; localStorage.setItem('snakeBest',best); document.getElementById('best').textContent=best; }
      document.getElementById('overlay-score').textContent = '得了 ' + score + ' 分';
      document.getElementById('overlay').classList.add('show');
      return;
    }
    snake.unshift(head);
    if (head.x===food.x&&head.y===food.y) { score+=10; document.getElementById('score').textContent=score; placeFood(); }
    else snake.pop();
    render();
  }

  function render() {
    ctx.fillStyle = '#1a2e1a';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    for (let i=0;i<=COLS;i++) { ctx.beginPath(); ctx.moveTo(MARGIN+i*SIZE,MARGIN); ctx.lineTo(MARGIN+i*SIZE,MARGIN+ROWS*SIZE); ctx.stroke(); }
    for (let i=0;i<=ROWS;i++) { ctx.beginPath(); ctx.moveTo(MARGIN,MARGIN+i*SIZE); ctx.lineTo(MARGIN+COLS*SIZE,MARGIN+i*SIZE); ctx.stroke(); }

    // food
    ctx.fillStyle = '#f07d3a';
    ctx.beginPath();
    ctx.arc(MARGIN+food.x*SIZE+SIZE/2, MARGIN+food.y*SIZE+SIZE/2, SIZE/2-2, 0, Math.PI*2);
    ctx.fill();

    // snake
    snake.forEach((s,i) => {
      const alpha = i===0 ? 1 : 0.85 - i*0.02;
      ctx.fillStyle = i===0 ? '#5bba8a' : `rgba(91,186,138,${Math.max(0.3,alpha)})`;
      const pad = i===0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(MARGIN+s.x*SIZE+pad, MARGIN+s.y*SIZE+pad, SIZE-pad*2, SIZE-pad*2, 4);
      ctx.fill();
    });
  }

  function setDir(x,y) {
    if (!running) { startGame(); return; }
    if (x===1&&dir.x===-1||x===-1&&dir.x===1) return;
    if (y===1&&dir.y===-1||y===-1&&dir.y===1) return;
    nextDir={x,y};
  }

  function togglePause() { paused=!paused; }

  document.addEventListener('keydown', e => {
    const map = {ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
    if (map[e.key]) { e.preventDefault(); setDir(...map[e.key]); }
  });

  // draw idle screen
  ctx.fillStyle='#1a2e1a'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='rgba(91,186,138,0.5)'; ctx.font='bold 2rem Caveat'; ctx.textAlign='center';
  ctx.fillText('按开始游戏 🐍', canvas.width/2, canvas.height/2);
</script>
</body>
</html>
