<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么 · 沙丁鱼</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream:#fdf6ec; --cream2:#faefd8; --warm:#f5e6c8;
    --accent-orange:#f07d3a; --accent-pink:#f06b8a;
    --accent-green:#5bba8a; --accent-blue:#4a9fd4;
    --accent-yellow:#f5c842;
    --text-dark:#2d2416; --text-mid:#6b5740; --text-light:#a89070;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'Noto Sans SC',sans-serif; color:var(--text-dark); min-height:100vh; }

  nav { position:sticky; top:0; z-index:100; background:rgba(253,246,236,0.92); backdrop-filter:blur(10px); border-bottom:2px dashed rgba(240,125,58,0.25); padding:0 1.5rem; height:56px; display:flex; align-items:center; justify-content:space-between; }
  .nav-left { display:flex; align-items:center; gap:12px; }
  .back-btn { font-family:'Caveat',cursive; font-size:1.1rem; color:var(--accent-orange); text-decoration:none; padding:4px 10px; border-radius:12px; transition:background 0.2s; }
  .back-btn:hover { background:rgba(240,125,58,0.1); }
  .page-title { font-family:'Caveat',cursive; font-size:1.4rem; font-weight:700; }
  .manage-btn { font-family:'Caveat',cursive; font-size:1rem; background:white; color:var(--text-mid); border:1.5px solid var(--warm); border-radius:20px; padding:6px 16px; cursor:pointer; transition:all 0.2s; }
  .manage-btn:hover { border-color:var(--accent-orange); color:var(--accent-orange); }

  /* main layout */
  .main { max-width:600px; margin:0 auto; padding:2rem 1.2rem; display:flex; flex-direction:column; align-items:center; gap:2rem; }

  /* wheel container */
  .wheel-wrap { position:relative; width:320px; height:320px; }

  .wheel-pointer {
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:28px solid var(--accent-orange);
    z-index:10;
    filter:drop-shadow(0 2px 4px rgba(240,125,58,0.4));
  }

  canvas#wheel { border-radius:50%; box-shadow:0 8px 32px rgba(0,0,0,0.15); display:block; }

  .wheel-center {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:48px; height:48px; border-radius:50%;
    background:white; border:4px solid var(--accent-orange);
    display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; z-index:10; cursor:pointer;
    box-shadow:0 2px 10px rgba(240,125,58,0.3);
    transition:transform 0.15s;
  }
  .wheel-center:hover { transform:translate(-50%,-50%) scale(1.1); }

  /* spin button */
  .spin-btn {
    font-family:'Caveat',cursive; font-size:1.4rem; font-weight:700;
    background:var(--accent-orange); color:white;
    border:none; border-radius:24px; padding:14px 48px;
    cursor:pointer; transition:all 0.2s;
    box-shadow:0 6px 20px rgba(240,125,58,0.35);
  }
  .spin-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(240,125,58,0.45); }
  .spin-btn:active { transform:translateY(0); }
  .spin-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

  /* result */
  .result-wrap {
    text-align:center; min-height:80px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
  }
  .result-label { font-family:'Caveat',cursive; font-size:1rem; color:var(--text-light); }
  .result-text {
    font-family:'Caveat',cursive; font-size:2.2rem; font-weight:700;
    color:var(--accent-orange); opacity:0;
    transition:all 0.4s ease;
    transform:scale(0.8);
  }
  .result-text.show { opacity:1; transform:scale(1); }
  .result-emoji { font-size:2rem; }

  /* empty state */
  .empty-state { text-align:center; color:var(--text-light); font-family:'Caveat',cursive; font-size:1.1rem; padding:2rem; }

  /* manage modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(45,36,22,0.4); z-index:200; align-items:center; justify-content:center; padding:1rem; }
  .modal-overlay.show { display:flex; }
  .modal { background:white; border-radius:24px; padding:1.5rem; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.15); animation:modalIn 0.25s ease; max-height:85vh; overflow-y:auto; }
  @keyframes modalIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.2rem; }
  .modal-title { font-family:'Caveat',cursive; font-size:1.4rem; font-weight:700; }
  .modal-close { background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--text-light); padding:4px; border-radius:8px; }
  .modal-close:hover { color:var(--accent-pink); }

  .add-row { display:flex; gap:8px; margin-bottom:1.2rem; }
  .add-input { flex:1; font-family:'Noto Sans SC',sans-serif; font-size:0.92rem; border:2px solid var(--warm); border-radius:12px; padding:9px 12px; outline:none; color:var(--text-dark); transition:border-color 0.2s; }
  .add-input:focus { border-color:var(--accent-orange); }
  .add-food-btn { font-family:'Caveat',cursive; font-size:1rem; background:var(--accent-orange); color:white; border:none; border-radius:12px; padding:9px 18px; cursor:pointer; transition:opacity 0.2s; white-space:nowrap; }
  .add-food-btn:hover { opacity:0.85; }

  .food-list { display:flex; flex-direction:column; gap:6px; }
  .food-item { display:flex; align-items:center; justify-content:space-between; background:var(--cream2); border-radius:12px; padding:10px 14px; animation:itemIn 0.2s ease; }
  @keyframes itemIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
  .food-item-name { font-family:'Caveat',cursive; font-size:1.1rem; color:var(--text-dark); }
  .food-del { background:none; border:none; font-size:1rem; cursor:pointer; color:var(--text-light); padding:2px 6px; border-radius:6px; transition:all 0.15s; }
  .food-del:hover { color:var(--accent-pink); background:rgba(240,107,138,0.1); }

  .food-count { font-family:'Caveat',cursive; font-size:0.9rem; color:var(--text-light); margin-bottom:8px; }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="index.html" class="back-btn">← 回首页</a>
    <span class="page-title">🎰 今天吃什么</span>
  </div>
  <button class="manage-btn" onclick="openManage()">⚙️ 管理菜单</button>
</nav>

<!-- manage modal -->
<div class="modal-overlay" id="modal" onclick="closeOnOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">🍽️ 管理菜单</span>
      <button class="modal-close" onclick="closeManage()">✕</button>
    </div>
    <div class="add-row">
      <input class="add-input" id="new-food" placeholder="输入菜名，比如：麻辣烫" maxlength="20"
        onkeydown="if(event.key==='Enter') addFood()"/>
      <button class="add-food-btn" onclick="addFood()">+ 添加</button>
    </div>
    <div class="food-count" id="food-count">共 0 道菜</div>
    <div class="food-list" id="food-list"></div>
  </div>
</div>

<div class="main">
  <div id="empty-hint" class="empty-state" style="display:none">
    还没有菜品，点右上角「管理菜单」添加吧 🍜
  </div>

  <div id="wheel-section" style="display:none; flex-direction:column; align-items:center; gap:2rem; width:100%">
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <canvas id="wheel" width="320" height="320"></canvas>
      <div class="wheel-center" onclick="spin()">🎲</div>
    </div>

    <div class="result-wrap">
      <div class="result-label" id="result-label">点击转盘或按钮开始</div>
      <div class="result-text" id="result-text"></div>
    </div>

    <button class="spin-btn" id="spin-btn" onclick="spin()">🎰 转！</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://sheythvfvmvwzvgvvwvm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoZXl0aHZmdm12d3p2Z3Z2d3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NDQzOTEsImV4cCI6MjA5NTQyMDM5MX0.wXOO4uyVhVeKlCQ2tyoyxdU0lWrYQRA2tQD4ho89iCo';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let foods = [];
  let spinning = false;
  let currentAngle = 0;

  const segColors = [
    '#f07d3a','#f06b8a','#5bba8a','#4a9fd4','#f5c842',
    '#a78bfa','#34d399','#fb923c','#60a5fa','#f472b6'
  ];

  // ── 加载菜品 ──
  async function loadFoods() {
    const { data } = await db.from('foods').select('*').order('created_at', { ascending: true });
    foods = data || [];
    renderAll();
  }

  function renderAll() {
    renderModalList();
    drawWheel();
    document.getElementById('empty-hint').style.display = foods.length === 0 ? 'block' : 'none';
    document.getElementById('wheel-section').style.display = foods.length > 0 ? 'flex' : 'none';
  }

  // ── 画转盘 ──
  function drawWheel(highlightIndex = -1) {
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const r = cx - 4;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (foods.length === 0) return;

    const arc = (2 * Math.PI) / foods.length;

    foods.forEach((f, i) => {
      const start = currentAngle + i * arc;
      const end = start + arc;

      // 扇形
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = highlightIndex === i
        ? lighten(segColors[i % segColors.length])
        : segColors[i % segColors.length];
      ctx.fill();
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 文字
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + arc / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = 'white';
      ctx.font = `bold ${foods.length > 8 ? 12 : 14}px 'Noto Sans SC', sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,0.2)';
      ctx.shadowBlur = 2;
      const maxLen = 6;
      const label = f.name.length > maxLen ? f.name.slice(0, maxLen) + '…' : f.name;
      ctx.fillText(label, r - 12, 5);
      ctx.restore();
    });

    // 中心圆
    ctx.beginPath();
    ctx.arc(cx, cy, 24, 0, 2 * Math.PI);
    ctx.fillStyle = 'white';
    ctx.fill();
    ctx.strokeStyle = '#f07d3a';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function lighten(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgb(${Math.min(255,r+40)},${Math.min(255,g+40)},${Math.min(255,b+40)})`;
  }

  // ── 转动 ──
  function spin() {
    if (spinning || foods.length === 0) return;
    spinning = true;

    const btn = document.getElementById('spin-btn');
    btn.disabled = true;

    const result = document.getElementById('result-text');
    result.classList.remove('show');
    document.getElementById('result-label').textContent = '转动中...';

    const extraSpins = 5 + Math.floor(Math.random() * 5); // 5-10圈
    const targetIndex = Math.floor(Math.random() * foods.length);
    const arc = (2 * Math.PI) / foods.length;

    // 目标角度：让指针（顶部，-π/2）指向 targetIndex 扇区中心
    const targetAngle = -(targetIndex * arc + arc / 2) - Math.PI / 2;
    const totalRotation = extraSpins * 2 * Math.PI + ((targetAngle - currentAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);

    const duration = 4000;
    const startTime = performance.now();
    const startAngle = currentAngle;

    function animate(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      // easeOutCubic
      const ease = 1 - Math.pow(1 - progress, 3);
      currentAngle = startAngle + totalRotation * ease;
      drawWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        currentAngle = startAngle + totalRotation;
        spinning = false;
        btn.disabled = false;
        drawWheel(targetIndex);
        showResult(foods[targetIndex].name);
      }
    }

    requestAnimationFrame(animate);
  }

  function showResult(name) {
    document.getElementById('result-label').textContent = '今天就吃——';
    const el = document.getElementById('result-text');
    el.textContent = name + ' 🎉';
    setTimeout(() => el.classList.add('show'), 50);
  }

  // ── 管理菜单 ──
  function renderModalList() {
    const list = document.getElementById('food-list');
    const count = document.getElementById('food-count');
    count.textContent = `共 ${foods.length} 道菜`;
    list.innerHTML = '';
    foods.forEach(f => {
      const item = document.createElement('div');
      item.className = 'food-item';
      item.innerHTML = `
        <span class="food-item-name">🍴 ${esc(f.name)}</span>
        <button class="food-del" onclick="deleteFood(${f.id})">🗑️ 删除</button>`;
      list.appendChild(item);
    });
    if (foods.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--text-light);font-family:Caveat,cursive;padding:1rem">还没有菜品，快加几个吧！</div>';
    }
  }

  async function addFood() {
    const input = document.getElementById('new-food');
    const name = input.value.trim();
    if (!name) return;
    const { data, error } = await db.from('foods').insert({ name }).select().single();
    if (error) { alert('添加失败，请重试'); return; }
    foods.push(data);
    input.value = '';
    renderAll();
  }

  async function deleteFood(id) {
    const { error } = await db.from('foods').delete().eq('id', id);
    if (error) { alert('删除失败'); return; }
    foods = foods.filter(f => f.id !== id);
    renderAll();
  }

  function openManage() { renderModalList(); document.getElementById('modal').classList.add('show'); }
  function closeManage() { document.getElementById('modal').classList.remove('show'); }
  function closeOnOverlay(e) { if (e.target === document.getElementById('modal')) closeManage(); }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  loadFoods();
</script>
</body>
</html>
