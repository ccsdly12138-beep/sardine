<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天穿了啥 · 沙丁鱼</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#fdf6ec; --cream2:#faefd8; --warm:#f5e6c8;
    --accent-orange:#f07d3a; --accent-pink:#f06b8a;
    --accent-green:#5bba8a; --accent-blue:#4a9fd4;
    --accent-yellow:#f5c842;
    --text-dark:#2d2416; --text-mid:#6b5740; --text-light:#a89070;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'Noto Sans SC',sans-serif; color:var(--text-dark); min-height:100vh; }

  nav {
    position:sticky; top:0; z-index:100;
    background:rgba(253,246,236,0.92); backdrop-filter:blur(10px);
    border-bottom:2px dashed rgba(240,125,58,0.25);
    padding:0 1.5rem; height:56px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .nav-left { display:flex; align-items:center; gap:12px; }
  .back-btn { font-family:'Caveat',cursive; font-size:1.1rem; color:var(--accent-orange); text-decoration:none; padding:4px 10px; border-radius:12px; transition:background 0.2s; }
  .back-btn:hover { background:rgba(240,125,58,0.1); }
  .page-title { font-family:'Caveat',cursive; font-size:1.4rem; font-weight:700; }
  .add-btn { font-family:'Caveat',cursive; font-size:1rem; background:var(--accent-orange); color:white; border:none; border-radius:20px; padding:6px 18px; cursor:pointer; box-shadow:0 3px 10px rgba(240,125,58,0.3); transition:all 0.2s; }
  .add-btn:hover { transform:scale(1.04); }

  .content { max-width:700px; margin:0 auto; padding:1.2rem; }

  /* date group */
  .date-group { margin-bottom:2rem; }
  .date-header {
    display:flex; align-items:center; gap:10px; margin-bottom:1rem;
    position:sticky; top:56px; z-index:50;
    background:var(--cream); padding:6px 0;
  }
  .date-label { font-family:'Caveat',cursive; font-size:1.3rem; font-weight:700; }
  .date-line { flex:1; height:2px; background:var(--warm); border-radius:1px; }
  .date-weather { font-size:1.1rem; }

  /* outfit card */
  .outfit-card {
    background:white; border-radius:20px; border:1.5px solid var(--warm);
    overflow:hidden; margin-bottom:14px;
    transition:all 0.22s; animation:cardIn 0.3s ease both;
  }
  @keyframes cardIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  .outfit-card:hover { box-shadow:0 8px 24px rgba(0,0,0,0.08); border-color:rgba(240,125,58,0.35); }

  .card-layout { display:flex; gap:0; }

  .card-img-wrap { width:140px; flex-shrink:0; position:relative; }
  .card-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; min-height:180px; cursor:pointer; }
  .no-img { width:140px; min-height:180px; background:var(--cream2); display:flex; align-items:center; justify-content:center; font-size:2.5rem; flex-direction:column; gap:6px; color:var(--text-light); }
  .no-img span { font-family:'Caveat',cursive; font-size:0.85rem; }

  .card-body { flex:1; padding:14px; display:flex; flex-direction:column; gap:8px; min-width:0; }

  .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card-title { font-family:'Caveat',cursive; font-size:1.3rem; font-weight:700; }
  .card-badges { display:flex; flex-wrap:wrap; gap:5px; }
  .badge {
    font-size:0.75rem; padding:2px 9px; border-radius:10px;
    font-family:'Caveat',cursive; font-size:0.85rem; white-space:nowrap;
  }
  .badge-occasion { background:#ffeef3; color:#b8456a; border:1px solid #f06b8a; }
  .badge-weather  { background:#eef5fb; color:#2272a0; border:1px solid #4a9fd4; }
  .badge-rating   { background:#fffbe8; color:#b8920a; border:1px solid #f5c842; }

  /* items list */
  .items-list { display:flex; flex-direction:column; gap:4px; }
  .item-row { display:flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--text-mid); }
  .item-icon { font-size:1rem; width:20px; text-align:center; flex-shrink:0; }
  .item-text { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .card-note { font-size:0.85rem; color:var(--text-mid); line-height:1.5; font-style:italic; }

  /* reactions */
  .reactions { display:flex; flex-wrap:wrap; gap:5px; }
  .reaction { display:flex; align-items:center; gap:3px; background:var(--cream2); border:1.5px solid var(--warm); border-radius:12px; padding:3px 8px; font-size:0.8rem; cursor:pointer; transition:all 0.15s; user-select:none; }
  .reaction:hover,.reaction.active { border-color:var(--accent-orange); background:rgba(240,125,58,0.1); }
  .reaction span { font-size:0.75rem; color:var(--text-mid); }
  .add-react { background:none; border:1.5px dashed var(--warm); border-radius:12px; padding:3px 8px; font-size:0.85rem; cursor:pointer; color:var(--text-light); transition:all 0.15s; }
  .add-react:hover { border-color:var(--accent-orange); color:var(--accent-orange); }

  /* comments */
  .comments { border-top:1px solid var(--warm); padding-top:8px; margin-top:4px; }
  .comment-item { display:flex; gap:6px; margin-bottom:7px; }
  .comment-avatar { width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:0.65rem; font-weight:700; color:white; flex-shrink:0; font-family:'Caveat',cursive; }
  .comment-name { font-size:0.72rem; color:var(--text-light); font-family:'Caveat',cursive; }
  .comment-text { font-size:0.83rem; color:var(--text-dark); line-height:1.4; }
  .comment-input-row { display:flex; gap:6px; margin-top:4px; }
  .comment-input { flex:1; font-family:'Noto Sans SC',sans-serif; font-size:0.82rem; border:1.5px solid var(--warm); border-radius:10px; padding:5px 10px; outline:none; background:var(--cream); color:var(--text-dark); transition:border-color 0.2s; }
  .comment-input:focus { border-color:var(--accent-orange); }
  .comment-send { background:var(--accent-orange); color:white; border:none; border-radius:10px; padding:5px 12px; font-size:0.82rem; cursor:pointer; }
  .comment-send:hover { opacity:0.85; }

  /* reaction popup */
  .rpop { display:none; position:fixed; background:white; border:1.5px solid var(--warm); border-radius:14px; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,0.12); z-index:300; flex-wrap:wrap; gap:4px; width:180px; }
  .rpop.show { display:flex; }
  .rpick { font-size:1.3rem; cursor:pointer; padding:4px; border-radius:8px; border:none; background:none; transition:background 0.15s; }
  .rpick:hover { background:var(--cream2); }

  /* modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(45,36,22,0.4); z-index:200; align-items:center; justify-content:center; padding:1rem; }
  .modal-overlay.show { display:flex; }
  .modal { background:white; border-radius:24px; padding:1.5rem; width:100%; max-width:500px; box-shadow:0 20px 60px rgba(0,0,0,0.15); animation:modalIn 0.25s ease; max-height:92vh; overflow-y:auto; }
  @keyframes modalIn { from{opacity:0;transform:translateY(20px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.2rem; }
  .modal-title { font-family:'Caveat',cursive; font-size:1.4rem; font-weight:700; }
  .modal-close { background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--text-light); padding:4px; border-radius:8px; }
  .modal-close:hover { color:var(--accent-pink); }

  .form-row { margin-bottom:12px; }
  .form-label { font-family:'Caveat',cursive; font-size:1rem; color:var(--text-mid); margin-bottom:4px; display:block; }
  .form-input { width:100%; font-family:'Noto Sans SC',sans-serif; font-size:0.92rem; border:2px solid var(--warm); border-radius:12px; padding:9px 12px; outline:none; color:var(--text-dark); transition:border-color 0.2s; background:white; }
  .form-input:focus { border-color:var(--accent-orange); }
  textarea.form-input { resize:none; min-height:60px; line-height:1.5; }
  .form-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }

  .chip-group { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-family:'Caveat',cursive; font-size:0.95rem; border:1.5px solid var(--warm); border-radius:12px; padding:4px 12px; cursor:pointer; background:white; color:var(--text-mid); transition:all 0.2s; }
  .chip.active,.chip:hover { border-color:var(--accent-orange); background:rgba(240,125,58,0.1); color:var(--accent-orange); }

  .items-form { display:flex; flex-direction:column; gap:8px; }
  .item-input-row { display:flex; align-items:center; gap:8px; }
  .item-emoji { font-size:1.2rem; width:28px; text-align:center; flex-shrink:0; }

  .img-upload-area { border:2px dashed var(--warm); border-radius:14px; padding:1.2rem; text-align:center; cursor:pointer; transition:all 0.2s; color:var(--text-light); font-family:'Caveat',cursive; font-size:1rem; }
  .img-upload-area:hover { border-color:var(--accent-orange); color:var(--accent-orange); }
  .img-preview { width:100%; border-radius:12px; margin-top:10px; display:none; max-height:200px; object-fit:cover; }

  .star-row { display:flex; gap:4px; }
  .star-pick { font-size:1.4rem; cursor:pointer; transition:transform 0.15s; user-select:none; }
  .star-pick:hover { transform:scale(1.2); }

  .post-btn { width:100%; font-family:'Caveat',cursive; font-size:1.1rem; background:var(--accent-orange); color:white; border:none; border-radius:14px; padding:10px; cursor:pointer; transition:all 0.2s; margin-top:4px; }
  .post-btn:hover { opacity:0.88; }

  #outfit-img-file { display:none; }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="index.html" class="back-btn">← 回首页</a>
    <span class="page-title">👗 今天穿了啥</span>
  </div>
  <button class="add-btn" onclick="openModal()">+ 记穿搭</button>
</nav>

<div class="rpop" id="rpop">
  <button class="rpick" onclick="pickR('🔥')">🔥</button>
  <button class="rpick" onclick="pickR('😍')">😍</button>
  <button class="rpick" onclick="pickR('👍')">👍</button>
  <button class="rpick" onclick="pickR('✨')">✨</button>
  <button class="rpick" onclick="pickR('🥰')">🥰</button>
  <button class="rpick" onclick="pickR('😂')">😂</button>
  <button class="rpick" onclick="pickR('💀')">💀</button>
  <button class="rpick" onclick="pickR('🫶')">🫶</button>
</div>

<div class="content" id="content"></div>

<!-- modal -->
<div class="modal-overlay" id="modal" onclick="closeOnOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">👗 记录今日穿搭</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-row">
      <label class="form-label">穿搭名字（可选）</label>
      <input class="form-input" id="o-title" placeholder="比如：今天很温柔风"/>
    </div>

    <div class="form-row">
      <label class="form-label">场合</label>
      <div class="chip-group" id="occasion-chips">
        <button class="chip active" onclick="selectChip(this,'occasion')">🏠 居家</button>
        <button class="chip" onclick="selectChip(this,'occasion')">🏢 上班</button>
        <button class="chip" onclick="selectChip(this,'occasion')">🎉 聚会</button>
        <button class="chip" onclick="selectChip(this,'occasion')">🛍️ 逛街</button>
        <button class="chip" onclick="selectChip(this,'occasion')">🍽️ 约饭</button>
        <button class="chip" onclick="selectChip(this,'occasion')">🏃 运动</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">天气</label>
      <div class="chip-group" id="weather-chips">
        <button class="chip active" onclick="selectChip(this,'weather')">☀️ 晴天</button>
        <button class="chip" onclick="selectChip(this,'weather')">⛅ 多云</button>
        <button class="chip" onclick="selectChip(this,'weather')">🌧️ 下雨</button>
        <button class="chip" onclick="selectChip(this,'weather')">❄️ 下雪</button>
        <button class="chip" onclick="selectChip(this,'weather')">💨 大风</button>
        <button class="chip" onclick="selectChip(this,'weather')">🌫️ 阴天</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">今日单品</label>
      <div class="items-form">
        <div class="item-input-row"><span class="item-emoji">👚</span><input class="form-input" id="i-top" placeholder="上衣"/></div>
        <div class="item-input-row"><span class="item-emoji">👖</span><input class="form-input" id="i-bottom" placeholder="裤子 / 裙子"/></div>
        <div class="item-input-row"><span class="item-emoji">👟</span><input class="form-input" id="i-shoes" placeholder="鞋子"/></div>
        <div class="item-input-row"><span class="item-emoji">👜</span><input class="form-input" id="i-bag" placeholder="包包（可选）"/></div>
        <div class="item-input-row"><span class="item-emoji">💍</span><input class="form-input" id="i-acc" placeholder="配饰（可选）"/></div>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">今天穿得几分</label>
      <div class="star-row" id="o-stars">
        <span class="star-pick" onclick="setOStar(1)">⭐</span>
        <span class="star-pick" onclick="setOStar(2)">⭐</span>
        <span class="star-pick" onclick="setOStar(3)">⭐</span>
        <span class="star-pick" onclick="setOStar(4)">⭐</span>
        <span class="star-pick" onclick="setOStar(5)">⭐</span>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">备注</label>
      <textarea class="form-input" id="o-note" placeholder="今天穿搭感受，或者哪里不满意..."></textarea>
    </div>

    <div class="form-row">
      <label class="form-label">拍张全身照</label>
      <div class="img-upload-area" onclick="document.getElementById('outfit-img-file').click()">
        📷 点击上传穿搭照片
      </div>
      <input type="file" id="outfit-img-file" accept="image/*" onchange="previewOutfitImg(this)"/>
      <img id="o-img-preview" class="img-preview"/>
    </div>

    <button class="post-btn" onclick="postOutfit()">保存今日穿搭 ✨</button>
  </div>
</div>

<script>
  let oStar = 5;
  let oOccasion = '🏠 居家';
  let oWeather = '☀️ 晴天';
  let oPendingImg = null;
  let rpopTarget = null;

  const sampleData = [
    {
      date:'今天', weather:'☀️ 晴天', outfits:[
        { title:'奶油色温柔风', occasion:'🍽️ 约饭', weather:'☀️ 晴天', items:{top:'白色蕾丝衬衫',bottom:'卡其色阔腿裤',shoes:'米白色乐福鞋',bag:'竹编小圆包',acc:'珍珠耳环'}, stars:5, note:'今天被朋友夸好看！！开心', img:null, reactions:{'😍':6,'🔥':3,'✨':4}, comments:[{name:'小鱼',color:'#4a9fd4',text:'好好看！下次教我搭'},{name:'阿橙',color:'#f06b8a',text:'珍珠耳环在哪买的'}] },
      ]
    },
    {
      date:'昨天', weather:'🌧️ 下雨', outfits:[
        { title:'雨天慵懒系', occasion:'🏠 居家', weather:'🌧️ 下雨', items:{top:'灰色oversize卫衣',bottom:'黑色运动短裤',shoes:'室内拖鞋',bag:'',acc:''}, stars:3, note:'下雨天懒得打扮，舒服就好', img:null, reactions:{'😂':5,'💀':2}, comments:[{name:'大头',color:'#5bba8a',text:'真实！'}] },
        { title:'上班苦行僧', occasion:'🏢 上班', weather:'🌧️ 下雨', items:{top:'黑色西装外套',bottom:'深蓝牛仔裤',shoes:'黑色小皮鞋',bag:'帆布托特包',acc:'手表'}, stars:4, note:'雨天还是得正式一点', img:null, reactions:{'👍':3,'✨':1}, comments:[] },
      ]
    }
  ];

  function renderAll(data) {
    const content = document.getElementById('content');
    content.innerHTML = '';
    data.forEach(group => {
      const g = document.createElement('div');
      g.className = 'date-group';
      g.innerHTML = `
        <div class="date-header">
          <span class="date-label">${group.date}</span>
          <span class="date-weather">${group.weather}</span>
          <div class="date-line"></div>
          <span style="font-family:'Caveat',cursive;font-size:0.95rem;color:var(--text-light)">${group.outfits.length} 套</span>
        </div>`;
      group.outfits.forEach(o => g.appendChild(buildCard(o)));
      content.appendChild(g);
    });
  }

  function buildCard(o) {
    const card = document.createElement('div');
    card.className = 'outfit-card';
    const starsHtml = '⭐'.repeat(o.stars) + '☆'.repeat(5-o.stars);
    const items = [
      o.items.top    && {icon:'👚', text:o.items.top},
      o.items.bottom && {icon:'👖', text:o.items.bottom},
      o.items.shoes  && {icon:'👟', text:o.items.shoes},
      o.items.bag    && {icon:'👜', text:o.items.bag},
      o.items.acc    && {icon:'💍', text:o.items.acc},
    ].filter(Boolean);

    const itemsHtml = items.map(i => `
      <div class="item-row">
        <span class="item-icon">${i.icon}</span>
        <span class="item-text">${esc(i.text)}</span>
      </div>`).join('');

    const reactHtml = Object.entries(o.reactions).map(([e,c]) =>
      `<span class="reaction" onclick="toggleR(this)">${e} <span>${c}</span></span>`
    ).join('');

    const commentsHtml = o.comments.map(c => `
      <div class="comment-item">
        <div class="comment-avatar" style="background:${c.color}">${c.name.slice(0,2)}</div>
        <div><div class="comment-name">${esc(c.name)}</div><div class="comment-text">${esc(c.text)}</div></div>
      </div>`).join('');

    card.innerHTML = `
      <div class="card-layout">
        ${o.img
          ? `<div class="card-img-wrap"><img src="${o.img}" alt="穿搭"/></div>`
          : `<div class="no-img">👗<span>暂无图片</span></div>`}
        <div class="card-body">
          <div class="card-top">
            <span class="card-title">${esc(o.title || '今日穿搭')}</span>
          </div>
          <div class="card-badges">
            <span class="badge badge-occasion">${o.occasion}</span>
            <span class="badge badge-weather">${o.weather}</span>
            <span class="badge badge-rating">${starsHtml}</span>
          </div>
          <div class="items-list">${itemsHtml}</div>
          ${o.note ? `<div class="card-note">"${esc(o.note)}"</div>` : ''}
          <div class="reactions">
            ${reactHtml}
            <button class="add-react" onclick="showRpop(event,this.closest('.outfit-card'))">+ 😊</button>
          </div>
          <div class="comments">
            ${commentsHtml}
            <div class="comment-input-row">
              <input class="comment-input" placeholder="留个评论..."/>
              <button class="comment-send" onclick="addComment(this)">回复</button>
            </div>
          </div>
        </div>
      </div>`;
    return card;
  }

  function toggleR(el) {
    el.classList.toggle('active');
    const s = el.querySelector('span');
    s.textContent = parseInt(s.textContent) + (el.classList.contains('active') ? 1 : -1);
  }

  function showRpop(e, card) {
    e.stopPropagation();
    rpopTarget = card;
    const pop = document.getElementById('rpop');
    pop.classList.add('show');
    pop.style.top = (e.clientY - 140) + 'px';
    pop.style.left = (e.clientX - 80) + 'px';
  }

  function pickR(emoji) {
    if (!rpopTarget) return;
    const rd = rpopTarget.querySelector('.reactions');
    const ex = [...rd.querySelectorAll('.reaction')].find(r => r.textContent.startsWith(emoji));
    if (ex) { ex.classList.add('active'); ex.querySelector('span').textContent = parseInt(ex.querySelector('span').textContent)+1; }
    else {
      const btn = rd.querySelector('.add-react');
      const r = document.createElement('span');
      r.className = 'reaction active';
      r.innerHTML = `${emoji} <span>1</span>`;
      r.onclick = function(){ toggleR(this); };
      rd.insertBefore(r, btn);
    }
    document.getElementById('rpop').classList.remove('show');
  }

  function addComment(btn) {
    const input = btn.previousElementSibling;
    const text = input.value.trim();
    if (!text) return;
    const row = btn.closest('.comment-input-row');
    const item = document.createElement('div');
    item.className = 'comment-item';
    item.innerHTML = `
      <div class="comment-avatar" style="background:var(--accent-orange)">我</div>
      <div><div class="comment-name">我</div><div class="comment-text">${esc(text)}</div></div>`;
    row.parentElement.insertBefore(item, row);
    input.value = '';
  }

  function selectChip(btn, group) {
    const parent = document.getElementById(group+'-chips');
    parent.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (group==='occasion') oOccasion = btn.textContent.trim();
    else oWeather = btn.textContent.trim();
  }

  function setOStar(n) {
    oStar = n;
    document.querySelectorAll('.star-pick').forEach((s,i) => s.textContent = i<n?'⭐':'☆');
  }

  function previewOutfitImg(input) {
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      oPendingImg = e.target.result;
      const p = document.getElementById('o-img-preview');
      p.src = oPendingImg; p.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  function openModal() { document.getElementById('modal').classList.add('show'); }
  function closeModal() {
    document.getElementById('modal').classList.remove('show');
    ['o-title','i-top','i-bottom','i-shoes','i-bag','i-acc','o-note'].forEach(id => document.getElementById(id).value='');
    oPendingImg=null;
    const p=document.getElementById('o-img-preview'); p.src=''; p.style.display='none';
    setOStar(5);
  }
  function closeOnOverlay(e) { if(e.target===document.getElementById('modal')) closeModal(); }

  function postOutfit() {
    const top = document.getElementById('i-top').value.trim();
    if (!top) { document.getElementById('i-top').focus(); return; }
    const outfit = {
      title: document.getElementById('o-title').value.trim() || '今日穿搭',
      occasion: oOccasion, weather: oWeather,
      items: {
        top, bottom:document.getElementById('i-bottom').value.trim(),
        shoes:document.getElementById('i-shoes').value.trim(),
        bag:document.getElementById('i-bag').value.trim(),
        acc:document.getElementById('i-acc').value.trim()
      },
      stars: oStar,
      note: document.getElementById('o-note').value.trim(),
      img: oPendingImg,
      reactions: {}, comments:[]
    };

    const content = document.getElementById('content');
    let todayGroup = content.querySelector('.date-group');
    if (!todayGroup || !todayGroup.querySelector('.date-label').textContent.includes('今天')) {
      todayGroup = document.createElement('div');
      todayGroup.className = 'date-group';
      todayGroup.innerHTML = `<div class="date-header"><span class="date-label">今天</span><span class="date-weather">${oWeather}</span><div class="date-line"></div><span style="font-family:'Caveat',cursive;font-size:0.95rem;color:var(--text-light)">0 套</span></div>`;
      content.insertBefore(todayGroup, content.firstChild);
    }
    todayGroup.appendChild(buildCard(outfit));
    const counter = todayGroup.querySelector('[style*="text-light"]');
    counter.textContent = (parseInt(counter.textContent)+1) + ' 套';
    closeModal();
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  document.addEventListener('click', e => {
    if (!document.getElementById('rpop').contains(e.target)) document.getElementById('rpop').classList.remove('show');
  });

  renderAll(sampleData);
</script>
</body>
</html>
