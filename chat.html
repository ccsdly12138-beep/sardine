<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天室 · 沙丁鱼</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream:#fdf6ec; --cream2:#faefd8; --warm:#f5e6c8;
    --accent-orange:#f07d3a; --accent-pink:#f06b8a;
    --accent-green:#5bba8a; --accent-blue:#4a9fd4;
    --text-dark:#2d2416; --text-mid:#6b5740; --text-light:#a89070;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'Noto Sans SC',sans-serif; color:var(--text-dark); height:100vh; display:flex; overflow:hidden; }

  .sidebar { width:220px; flex-shrink:0; background:white; border-right:2px dashed rgba(240,125,58,0.2); display:flex; flex-direction:column; }
  .sidebar-top { padding:1rem; border-bottom:1.5px dashed var(--warm); }
  .sidebar-logo { font-family:'Caveat',cursive; font-size:1.3rem; font-weight:700; color:var(--accent-orange); display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .my-info { display:flex; align-items:center; gap:8px; }
  .my-avatar { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Caveat',cursive; font-size:0.85rem; font-weight:700; color:white; flex-shrink:0; }
  .my-name { font-family:'Caveat',cursive; font-size:1rem; font-weight:600; color:var(--text-dark); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .logout-btn { background:none; border:none; font-size:0.8rem; color:var(--text-light); cursor:pointer; padding:2px 6px; border-radius:6px; transition:all 0.2s; }
  .logout-btn:hover { color:var(--accent-pink); }

  .sidebar-section { padding:10px 12px 4px; font-family:'Caveat',cursive; font-size:0.9rem; color:var(--text-light); }

  .room-item { display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; border-radius:10px; margin:2px 6px; transition:all 0.2s; }
  .room-item:hover { background:var(--cream2); }
  .room-item.active { background:rgba(240,125,58,0.12); }
  .room-icon { font-size:1.1rem; }
  .room-name { font-family:'Caveat',cursive; font-size:1rem; color:var(--text-dark); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .members-list { flex:1; overflow-y:auto; }
  .member-item { display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; border-radius:10px; margin:2px 6px; transition:all 0.2s; }
  .member-item:hover { background:var(--cream2); }
  .member-item.active { background:rgba(240,125,58,0.12); }
  .member-avatar { width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-family:'Caveat',cursive; font-size:0.75rem; font-weight:700; color:white; flex-shrink:0; }
  .member-name { font-family:'Caveat',cursive; font-size:1rem; color:var(--text-dark); flex:1; }
  .online-dot { width:7px; height:7px; border-radius:50%; background:var(--accent-green); flex-shrink:0; }

  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { background:rgba(253,246,236,0.95); backdrop-filter:blur(10px); border-bottom:2px dashed rgba(240,125,58,0.25); padding:0 1.2rem; height:52px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .chat-title { font-family:'Caveat',cursive; font-size:1.2rem; font-weight:700; }
  .back-home { font-family:'Caveat',cursive; font-size:0.95rem; color:var(--accent-orange); text-decoration:none; padding:4px 10px; border-radius:10px; transition:background 0.2s; }
  .back-home:hover { background:rgba(240,125,58,0.1); }

  .messages { flex:1; overflow-y:auto; padding:1rem 1rem 0.5rem; display:flex; flex-direction:column; gap:4px; scroll-behavior:smooth; }
  .messages::-webkit-scrollbar { width:4px; }
  .messages::-webkit-scrollbar-thumb { background:var(--warm); border-radius:2px; }

  .sys-msg { text-align:center; color:var(--text-light); font-family:'Caveat',cursive; font-size:0.95rem; margin:6px 0; }
  .msg-row { display:flex; align-items:flex-end; gap:8px; max-width:75%; animation:msgIn 0.25s ease; }
  @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .msg-row.self { align-self:flex-end; flex-direction:row-reverse; }
  .msg-row.other { align-self:flex-start; }
  .avatar { width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Caveat',cursive; font-size:0.9rem; font-weight:700; color:white; flex-shrink:0; }
  .bubble-wrap { display:flex; flex-direction:column; gap:2px; }
  .bubble-name { font-family:'Caveat',cursive; font-size:0.88rem; color:var(--text-light); padding:0 4px; }
  .msg-row.self .bubble-name { text-align:right; }
  .bubble { padding:9px 13px; border-radius:16px; font-size:0.9rem; line-height:1.55; word-break:break-word; }
  .msg-row.self .bubble { background:var(--accent-orange); color:white; border-bottom-right-radius:4px; }
  .msg-row.other .bubble { background:white; color:var(--text-dark); border:1.5px solid var(--warm); border-bottom-left-radius:4px; }
  .bubble img { max-width:160px; max-height:180px; border-radius:10px; display:block; cursor:pointer; }
  .bubble-time { font-size:0.68rem; color:var(--text-light); padding:0 4px; }
  .msg-row.self .bubble-time { text-align:right; }

  .input-area { background:rgba(253,246,236,0.97); border-top:2px dashed rgba(240,125,58,0.2); padding:10px 1rem; flex-shrink:0; }
  .emoji-picker { display:none; flex-wrap:wrap; gap:4px; background:white; border:1.5px solid var(--warm); border-radius:14px; padding:8px; margin-bottom:8px; max-width:260px; }
  .emoji-picker.show { display:flex; }
  .emoji-btn { font-size:1.3rem; cursor:pointer; padding:3px; border-radius:7px; border:none; background:none; }
  .emoji-btn:hover { background:var(--cream2); }
  .img-preview-wrap { display:none; align-items:center; gap:8px; margin-bottom:8px; background:white; border:1.5px solid var(--warm); border-radius:12px; padding:7px 12px; }
  .img-preview-wrap.show { display:flex; }
  .img-preview-wrap img { height:44px; border-radius:7px; }
  .img-remove { background:none; border:none; font-size:1rem; cursor:pointer; color:var(--text-light); }
  .input-toolbar { display:flex; gap:6px; margin-bottom:7px; }
  .tool-btn { background:none; border:1.5px solid var(--warm); border-radius:10px; padding:4px 10px; font-size:1rem; cursor:pointer; transition:all 0.2s; }
  .tool-btn:hover { border-color:var(--accent-orange); background:rgba(240,125,58,0.07); }
  .input-row { display:flex; gap:8px; align-items:flex-end; }
  .msg-input { flex:1; font-family:'Noto Sans SC',sans-serif; font-size:0.9rem; border:2px solid var(--warm); border-radius:16px; padding:8px 13px; background:white; color:var(--text-dark); outline:none; resize:none; line-height:1.5; max-height:90px; transition:border-color 0.2s; }
  .msg-input:focus { border-color:var(--accent-orange); }
  .send-btn { background:var(--accent-orange); color:white; border:none; border-radius:50%; width:40px; height:40px; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 3px 10px rgba(240,125,58,0.35); transition:all 0.2s; }
  .send-btn:hover { transform:scale(1.08); }
  #img-input { display:none; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-logo">🐟 沙丁鱼</div>
    <div class="my-info">
      <div class="my-avatar" id="my-avatar">?</div>
      <span class="my-name" id="my-name">加载中...</span>
      <button class="logout-btn" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="sidebar-section">频道</div>
  <div class="room-item active" id="nav-public" onclick="switchRoom('public','🐟 大家一起聊')">
    <span class="room-icon">🐟</span>
    <span class="room-name">大家一起聊</span>
  </div>
  <div class="sidebar-section">私聊成员</div>
  <div class="members-list" id="members-list">
    <div class="sys-msg" style="font-size:0.8rem;padding:8px">加载中...</div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="chat-title" id="chat-title">🐟 大家一起聊</div>
    <a href="index.html" class="back-home">← 回首页</a>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="emoji-picker" id="emoji-picker">
      <button class="emoji-btn" onclick="insertEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="insertEmoji('🤣')">🤣</button>
      <button class="emoji-btn" onclick="insertEmoji('😭')">😭</button>
      <button class="emoji-btn" onclick="insertEmoji('🥹')">🥹</button>
      <button class="emoji-btn" onclick="insertEmoji('😤')">😤</button>
      <button class="emoji-btn" onclick="insertEmoji('💀')">💀</button>
      <button class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="insertEmoji('🐟')">🐟</button>
      <button class="emoji-btn" onclick="insertEmoji('✨')">✨</button>
      <button class="emoji-btn" onclick="insertEmoji('🫶')">🫶</button>
    </div>
    <div class="img-preview-wrap" id="img-preview-wrap">
      <img id="img-preview" src="" alt=""/>
      <span style="font-size:0.8rem;color:var(--text-light);flex:1">图片已选择</span>
      <button class="img-remove" onclick="removeImg()">✕</button>
    </div>
    <div class="input-toolbar">
      <button class="tool-btn" onclick="toggleEmoji()">😊</button>
      <button class="tool-btn" onclick="document.getElementById('img-input').click()">🖼️</button>
      <input type="file" id="img-input" accept="image/*" onchange="previewImg(this)"/>
    </div>
    <div class="input-row">
      <textarea class="msg-input" id="msg-input" placeholder="说点什么..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://sheythvfvmvwzvgvvwvm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoZXl0aHZmdm12d3p2Z3Z2d3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NDQzOTEsImV4cCI6MjA5NTQyMDM5MX0.wXOO4uyVhVeKlCQ2tyoyxdU0lWrYQRA2tQD4ho89iCo';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  const colors = ['#f07d3a','#f06b8a','#5bba8a','#4a9fd4','#f5c842','#a78bfa','#34d399'];
  const colorMap = {};
  function getColor(name) {
    if (!colorMap[name]) colorMap[name] = colors[Object.keys(colorMap).length % colors.length];
    return colorMap[name];
  }

  let myUser = null;
  let myNickname = '';
  let currentRoom = 'public';
  let pendingImg = null;
  let realtimeChannel = null;

  function getTime(ts) {
    const d = ts ? new Date(ts) : new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function scrollBottom() { const m=document.getElementById('messages'); setTimeout(()=>m.scrollTop=m.scrollHeight,50); }

  async function init() {
    const { data:{ session } } = await db.auth.getSession();
    if (!session) { window.location.href='auth.html'; return; }
    myUser = session.user;

    const { data:profile } = await db.from('profiles').select('nickname').eq('user_id', myUser.id).single();
    myNickname = profile?.nickname || myUser.email.split('@')[0];

    const color = getColor(myNickname);
    document.getElementById('my-avatar').textContent = myNickname.slice(0,2);
    document.getElementById('my-avatar').style.background = color;
    document.getElementById('my-name').textContent = myNickname;

    await loadMembers();
    await switchRoom('public', '🐟 大家一起聊');
  }

  async function loadMembers() {
    const { data } = await db.from('profiles').select('user_id, nickname');
    const list = document.getElementById('members-list');
    list.innerHTML = '';
    if (!data || data.length === 0) {
      list.innerHTML = '<div class="sys-msg" style="font-size:0.8rem;padding:8px">暂无其他成员</div>';
      return;
    }
    data.forEach(p => {
      if (p.user_id === myUser.id) return;
      const roomId = [myUser.id, p.user_id].sort().join('_');
      const color = getColor(p.nickname);
      const item = document.createElement('div');
      item.className = 'member-item';
      item.dataset.roomId = roomId;
      item.innerHTML = `
        <div class="member-avatar" style="background:${color}">${p.nickname.slice(0,2)}</div>
        <span class="member-name">${esc(p.nickname)}</span>
        <div class="online-dot"></div>`;
      item.onclick = () => switchRoom(roomId, '💬 ' + p.nickname);
      list.appendChild(item);
    });
  }

  async function switchRoom(roomId, title) {
    currentRoom = roomId;
    document.getElementById('chat-title').textContent = title;

    // 更新高亮
    document.querySelectorAll('.room-item, .member-item').forEach(el => el.classList.remove('active'));
    if (roomId === 'public') {
      document.getElementById('nav-public').classList.add('active');
    } else {
      const el = document.querySelector(`[data-room-id="${roomId}"]`);
      if (el) el.classList.add('active');
    }

    // 取消旧的实时订阅
    if (realtimeChannel) {
      await db.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }

    // 加载历史消息
    await loadMessages(roomId);

    // 开启新的实时订阅
    subscribeRealtime(roomId);
  }

  async function loadMessages(roomId) {
    const msgs = document.getElementById('messages');
    msgs.innerHTML = '<div class="sys-msg">加载消息中...</div>';

    const { data, error } = await db
      .from('messages')
      .select('*')
      .eq('room', roomId)
      .order('created_at', { ascending: true })
      .limit(100);

    msgs.innerHTML = '';

    if (error) {
      msgs.innerHTML = '<div class="sys-msg">加载失败，请刷新重试</div>';
      return;
    }

    if (!data || data.length === 0) {
      msgs.innerHTML = '<div class="sys-msg">还没有消息，来说点什么吧 🐟</div>';
      return;
    }

    data.forEach(m => renderMsg(m, m.nickname === myNickname));
    scrollBottom();
  }

  function subscribeRealtime(roomId) {
    realtimeChannel = db.channel('room_' + roomId)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'messages'
      }, payload => {
        const msg = payload.new;
        // 只处理当前房间的消息，且不是自己发的（自己发的已经乐观渲染了）
        if (msg.room === currentRoom && msg.nickname !== myNickname) {
          renderMsg(msg, false);
        }
      })
      .subscribe();
  }

  function renderMsg(msg, isSelf) {
    const msgs = document.getElementById('messages');
    // 如果只有"还没有消息"提示，先清空
    const sysMsgs = msgs.querySelectorAll('.sys-msg');
    if (sysMsgs.length === 1 && msgs.children.length === 1) msgs.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'msg-row ' + (isSelf ? 'self' : 'other');
    const color = getColor(msg.nickname);
    let content = '';
    if (msg.img_url) {
      content = `<img src="${msg.img_url}" onclick="window.open(this.src,'_blank')"/>`;
      if (msg.content) content += `<div style="margin-top:5px">${esc(msg.content)}</div>`;
    } else {
      content = esc(msg.content);
    }
    row.innerHTML = `
      <div class="avatar" style="background:${color}">${msg.nickname.slice(0,2)}</div>
      <div class="bubble-wrap">
        <div class="bubble-name">${esc(msg.nickname)}</div>
        <div class="bubble">${content}</div>
        <div class="bubble-time">${getTime(msg.created_at)}</div>
      </div>`;
    msgs.appendChild(row);
    scrollBottom();
  }

  async function sendMsg() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text && !pendingImg) return;

    const msgData = {
      nickname: myNickname,
      content: text,
      img_url: pendingImg || null,
      room: currentRoom
    };

    // 乐观渲染（先显示，再存数据库）
    renderMsg({ ...msgData, created_at: new Date().toISOString() }, true);
    input.value = '';
    input.style.height = 'auto';
    removeImg();

    const { error } = await db.from('messages').insert(msgData);
    if (error) console.error('发送失败:', error);
  }

  async function logout() {
    await db.auth.signOut();
    window.location.href = 'auth.html';
  }

  function handleKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} }
  function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,90)+'px'; }
  function toggleEmoji() { document.getElementById('emoji-picker').classList.toggle('show'); }
  function insertEmoji(e) { document.getElementById('msg-input').value+=e; document.getElementById('emoji-picker').classList.remove('show'); }
  function previewImg(input) {
    const file=input.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=e=>{ pendingImg=e.target.result; document.getElementById('img-preview').src=pendingImg; document.getElementById('img-preview-wrap').classList.add('show'); };
    reader.readAsDataURL(file);
  }
  function removeImg() { pendingImg=null; document.getElementById('img-preview-wrap').classList.remove('show'); document.getElementById('img-input').value=''; }

  init();
</script>
</body>
</html>
