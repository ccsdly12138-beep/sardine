<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天室 · 沙丁鱼</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #fdf6ec; --cream2: #faefd8; --warm: #f5e6c8;
    --accent-orange: #f07d3a; --accent-pink: #f06b8a;
    --accent-green: #5bba8a; --accent-blue: #4a9fd4;
    --text-dark: #2d2416; --text-mid: #6b5740; --text-light: #a89070;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--cream); font-family:'Noto Sans SC',sans-serif; color:var(--text-dark); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  .topbar { position:sticky; top:0; z-index:100; background:rgba(253,246,236,0.95); backdrop-filter:blur(10px); border-bottom:2px dashed rgba(240,125,58,0.25); padding:0 1.2rem; height:56px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .back-btn { font-family:'Caveat',cursive; font-size:1.1rem; color:var(--accent-orange); text-decoration:none; display:flex; align-items:center; gap:4px; padding:4px 10px; border-radius:12px; transition:background 0.2s; }
  .back-btn:hover { background:rgba(240,125,58,0.1); }
  .room-title { font-family:'Caveat',cursive; font-size:1.3rem; font-weight:700; display:flex; align-items:center; gap:6px; }
  .online-badge { background:var(--accent-green); color:white; font-size:0.7rem; padding:2px 8px; border-radius:10px; display:flex; align-items:center; gap:4px; }
  .online-badge::before { content:''; width:6px; height:6px; background:white; border-radius:50%; animation:pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .nickname-bar { background:var(--cream2); border-bottom:1.5px dashed rgba(240,125,58,0.2); padding:8px 1.2rem; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .nickname-bar span { font-family:'Caveat',cursive; font-size:1rem; color:var(--text-mid); }
  .nickname-input { font-family:'Caveat',cursive; font-size:1rem; border:1.5px solid var(--warm); border-radius:10px; padding:3px 10px; background:white; color:var(--text-dark); width:120px; outline:none; transition:border-color 0.2s; }
  .nickname-input:focus { border-color:var(--accent-orange); }
  .nickname-confirm { font-family:'Caveat',cursive; font-size:0.95rem; background:var(--accent-orange); color:white; border:none; border-radius:10px; padding:4px 14px; cursor:pointer; transition:opacity 0.2s; }
  .nickname-confirm:hover { opacity:0.85; }
  #current-nick { color:var(--accent-orange); font-family:'Caveat',cursive; font-size:1rem; }

  .messages { flex:1; overflow-y:auto; padding:1rem 1rem 0.5rem; display:flex; flex-direction:column; gap:4px; scroll-behavior:smooth; }
  .messages::-webkit-scrollbar { width:4px; }
  .messages::-webkit-scrollbar-thumb { background:var(--warm); border-radius:2px; }

  .date-divider { text-align:center; margin:10px 0; }
  .date-divider span { background:var(--cream2); color:var(--text-light); font-size:0.75rem; padding:3px 12px; border-radius:10px; }
  .sys-msg { text-align:center; color:var(--text-light); font-family:'Caveat',cursive; font-size:0.95rem; margin:4px 0; }

  .msg-row { display:flex; align-items:flex-end; gap:8px; max-width:75%; animation:msgIn 0.25s ease; }
  @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .msg-row.self { align-self:flex-end; flex-direction:row-reverse; }
  .msg-row.other { align-self:flex-start; }

  .avatar { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Caveat',cursive; font-size:0.95rem; font-weight:700; color:white; flex-shrink:0; user-select:none; }
  .bubble-wrap { display:flex; flex-direction:column; gap:2px; }
  .bubble-name { font-family:'Caveat',cursive; font-size:0.9rem; color:var(--text-light); padding:0 4px; }
  .msg-row.self .bubble-name { text-align:right; }
  .bubble { padding:9px 13px; border-radius:16px; font-size:0.92rem; line-height:1.55; word-break:break-word; position:relative; max-width:100%; }
  .msg-row.self .bubble { background:var(--accent-orange); color:white; border-bottom-right-radius:4px; }
  .msg-row.other .bubble { background:white; color:var(--text-dark); border:1.5px solid var(--warm); border-bottom-left-radius:4px; }
  .bubble img { max-width:180px; max-height:200px; border-radius:10px; display:block; cursor:pointer; }
  .bubble-time { font-size:0.7rem; color:var(--text-light); padding:0 4px; align-self:flex-end; }
  .msg-row.self .bubble-time { text-align:right; }

  .input-area { background:rgba(253,246,236,0.97); border-top:2px dashed rgba(240,125,58,0.2); padding:10px 1rem; flex-shrink:0; }
  .input-toolbar { display:flex; gap:6px; margin-bottom:8px; }
  .tool-btn { background:none; border:1.5px solid var(--warm); border-radius:10px; padding:4px 10px; font-size:1.1rem; cursor:pointer; transition:all 0.2s; color:var(--text-mid); }
  .tool-btn:hover { border-color:var(--accent-orange); background:rgba(240,125,58,0.07); transform:scale(1.1); }

  .emoji-picker { display:none; flex-wrap:wrap; gap:4px; background:white; border:1.5px solid var(--warm); border-radius:14px; padding:10px; margin-bottom:8px; max-width:280px; }
  .emoji-picker.show { display:flex; }
  .emoji-btn { font-size:1.4rem; cursor:pointer; padding:4px; border-radius:8px; transition:background 0.15s; border:none; background:none; }
  .emoji-btn:hover { background:var(--cream2); }

  .img-preview-wrap { display:none; align-items:center; gap:8px; margin-bottom:8px; background:white; border:1.5px solid var(--warm); border-radius:12px; padding:8px 12px; }
  .img-preview-wrap.show { display:flex; }
  .img-preview-wrap img { height:50px; border-radius:8px; object-fit:cover; }
  .img-remove { background:none; border:none; font-size:1.1rem; cursor:pointer; color:var(--text-light); }
  .img-remove:hover { color:var(--accent-pink); }

  .input-row { display:flex; gap:8px; align-items:flex-end; }
  .msg-input { flex:1; font-family:'Noto Sans SC',sans-serif; font-size:0.92rem; border:2px solid var(--warm); border-radius:16px; padding:9px 14px; background:white; color:var(--text-dark); outline:none; resize:none; line-height:1.5; max-height:100px; transition:border-color 0.2s; }
  .msg-input:focus { border-color:var(--accent-orange); }
  .send-btn { background:var(--accent-orange); color:white; border:none; border-radius:50%; width:42px; height:42px; font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; box-shadow:0 3px 10px rgba(240,125,58,0.35); }
  .send-btn:hover { transform:scale(1.08); }
  .send-btn:active { transform:scale(0.95); }
  #img-input { display:none; }

  .loading { text-align:center; color:var(--text-light); font-family:'Caveat',cursive; font-size:1rem; padding:1rem; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-btn">← 回首页</a>
    <div class="room-title">🐟 沙丁鱼聊天室 <span class="online-badge">在线</span></div>
  </div>
</div>

<div class="nickname-bar">
  <span>你的昵称：</span>
  <input class="nickname-input" id="nickname-input" placeholder="起个名字" maxlength="10"/>
  <button class="nickname-confirm" onclick="setNickname()">确认</button>
  <span id="current-nick"></span>
</div>

<div class="messages" id="messages">
  <div class="sys-msg">🐟 欢迎来到沙丁鱼聊天室～</div>
</div>

<div class="input-area">
  <div class="emoji-picker" id="emoji-picker">
    <button class="emoji-btn" onclick="insertEmoji('😂')">😂</button>
    <button class="emoji-btn" onclick="insertEmoji('🤣')">🤣</button>
    <button class="emoji-btn" onclick="insertEmoji('😭')">😭</button>
    <button class="emoji-btn" onclick="insertEmoji('🥹')">🥹</button>
    <button class="emoji-btn" onclick="insertEmoji('😤')">😤</button>
    <button class="emoji-btn" onclick="insertEmoji('🤯')">🤯</button>
    <button class="emoji-btn" onclick="insertEmoji('😅')">😅</button>
    <button class="emoji-btn" onclick="insertEmoji('🫠')">🫠</button>
    <button class="emoji-btn" onclick="insertEmoji('👍')">👍</button>
    <button class="emoji-btn" onclick="insertEmoji('🙏')">🙏</button>
    <button class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
    <button class="emoji-btn" onclick="insertEmoji('💀')">💀</button>
    <button class="emoji-btn" onclick="insertEmoji('🐟')">🐟</button>
    <button class="emoji-btn" onclick="insertEmoji('🍊')">🍊</button>
    <button class="emoji-btn" onclick="insertEmoji('✨')">✨</button>
    <button class="emoji-btn" onclick="insertEmoji('🫶')">🫶</button>
  </div>
  <div class="img-preview-wrap" id="img-preview-wrap">
    <img id="img-preview" src="" alt="预览"/>
    <span style="font-size:0.8rem;color:var(--text-light);flex:1">图片已选择</span>
    <button class="img-remove" onclick="removeImg()">✕</button>
  </div>
  <div class="input-toolbar">
    <button class="tool-btn" onclick="toggleEmoji()">😊</button>
    <button class="tool-btn" onclick="document.getElementById('img-input').click()">🖼️</button>
    <input type="file" id="img-input" accept="image/*" onchange="previewImg(this)"/>
  </div>
  <div class="input-row">
    <textarea class="msg-input" id="msg-input" placeholder="说点什么..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://sheythvfvmvwzvgvvwvm.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoZXl0aHZmdm12d3p2Z3Z2d3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NDQzOTEsImV4cCI6MjA5NTQyMDM5MX0.wXOO4uyVhVeKlCQ2tyoyxdU0lWrYQRA2tQD4ho89iCo';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let nickname = '';
  let pendingImg = null;
  const colors = ['#f07d3a','#f06b8a','#5bba8a','#4a9fd4','#f5c842','#a78bfa','#34d399','#fb923c'];
  const colorMap = {};

  function getColor(name) {
    if (!colorMap[name]) colorMap[name] = colors[Object.keys(colorMap).length % colors.length];
    return colorMap[name];
  }

  function getTime(ts) {
    const d = ts ? new Date(ts) : new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function setNickname() {
    const val = document.getElementById('nickname-input').value.trim();
    if (!val) return;
    nickname = val;
    document.getElementById('current-nick').textContent = '当前：' + nickname;
    document.getElementById('nickname-input').value = '';
    addSysMsg('🎉 ' + nickname + ' 进入了聊天室');
  }

  function addSysMsg(text) {
    const div = document.createElement('div');
    div.className = 'sys-msg';
    div.textContent = text;
    document.getElementById('messages').appendChild(div);
    scrollBottom();
  }

  function renderMsg(msg, isSelf) {
    const messages = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row ' + (isSelf ? 'self' : 'other');
    const color = getColor(msg.nickname);
    let bubbleContent = '';
    if (msg.img_url) {
      bubbleContent = `<img src="${msg.img_url}" alt="图片" onclick="window.open(this.src,'_blank')"/>`;
      if (msg.content) bubbleContent += `<div style="margin-top:6px">${esc(msg.content)}</div>`;
    } else {
      bubbleContent = esc(msg.content);
    }
    row.innerHTML = `
      <div class="avatar" style="background:${color}">${msg.nickname.slice(0,2)}</div>
      <div class="bubble-wrap">
        <div class="bubble-name">${esc(msg.nickname)}</div>
        <div class="bubble">${bubbleContent}</div>
        <div class="bubble-time">${getTime(msg.created_at)}</div>
      </div>`;
    messages.appendChild(row);
    scrollBottom();
  }

  async function loadMessages() {
    const { data, error } = await db.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
    if (error) { console.error(error); return; }
    data.forEach(msg => renderMsg(msg, msg.nickname === nickname));
  }

  function subscribeRealtime() {
    db.channel('messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const msg = payload.new;
        if (msg.nickname !== nickname) renderMsg(msg, false);
      })
      .subscribe();
  }

  async function sendMsg() {
    if (!nickname) { alert('请先设置昵称！'); return; }
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text && !pendingImg) return;

    const msgData = { nickname, content: text, img_url: pendingImg || null };
    renderMsg({ ...msgData, created_at: new Date().toISOString() }, true);
    input.value = '';
    input.style.height = 'auto';
    removeImg();

    const { error } = await db.from('messages').insert(msgData);
    if (error) console.error('发送失败:', error);
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function handleKey(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }
  function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
  function scrollBottom() { const m=document.getElementById('messages'); setTimeout(()=>m.scrollTop=m.scrollHeight,50); }
  function toggleEmoji() { document.getElementById('emoji-picker').classList.toggle('show'); }
  function insertEmoji(e) { document.getElementById('msg-input').value+=e; document.getElementById('emoji-picker').classList.remove('show'); }

  function previewImg(input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      pendingImg = e.target.result;
      document.getElementById('img-preview').src = pendingImg;
      document.getElementById('img-preview-wrap').classList.add('show');
    };
    reader.readAsDataURL(file);
  }

  function removeImg() {
    pendingImg = null;
    document.getElementById('img-preview-wrap').classList.remove('show');
    document.getElementById('img-input').value = '';
  }

  loadMessages();
  subscribeRealtime();
</script>
</body>
</html>
